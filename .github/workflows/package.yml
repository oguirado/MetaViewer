# Hosted runner evidence is [VM]; sealed capsule/runtime gates remain host-only.
name: Linux package verification
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux-package:
    # [TARGET, unit decision] Fork PRs have no admitted private kit access.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    # [TARGET, unit decision] Native builds and real package verification per arch.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Read locked kit identity
        id: kit
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          lock = json.load(open('ui/kit.lock.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          match = re.fullmatch(r'https://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\.git', lock['repo'])
          assert match, 'kit repository is not a GitHub checkout'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + match[1], file=output)
              print('commit=' + lock['commit'], file=output)
          PYEOF
      - name: Require kit access
        env:
          KIT_REPO_TOKEN: ${{ secrets.KIT_REPO_TOKEN }}
        run: test -n "$KIT_REPO_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.commit }}
          token: ${{ secrets.KIT_REPO_TOKEN }}
          path: kit-checkout
          persist-credentials: false
      - name: Canonicalize checkout origin for lock verification
        run: |
          origin="$(git -C kit-checkout remote get-url origin)"
          git -C kit-checkout remote set-url origin "${origin%.git}.git"
      - name: Prime locked dependencies
        working-directory: ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare verified Electron and offline namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/workflows/offline.sh npm --prefix ui ci --offline --ignore-scripts --no-audit --no-fund
          node .github/workflows/install_electron.cjs
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # setup-go v5
        with:
          go-version-file: daemon-adapter/go.mod
          cache: false
      - name: Prime native toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          cargo fetch --locked
          (cd daemon-adapter && go mod download)
          command -v xvfb-run
          command -v strace
          command -v zip
      - name: Execute gate and publish receipt
        if: always()
        env:
          JOB_ID: linux-package
          PLATFORM: ${{ matrix.platform }}
          SETUP_RESULT: ${{ job.status }}
          MV_PKG_OUT: ${{ runner.temp }}/metaviewer-package
          CAPSULE_UI_KIT_REPO: ${{ github.workspace }}/kit-checkout
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/ui/node_modules/electron/dist
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-cargo-target
        run: |
          set +e
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "$EVDIR"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/package.yml","rb").read()).hexdigest())')"
          ISSUER="CI/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              text = re.sub(re.escape(prefix).replace('_', '(?:_|%5[fF])') + r'(?:[A-Za-z0-9_\-]|%[0-9a-fA-F]{2}){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          if e['PARSEUT'] == '1' and passed is None:
              text = open(e['SANE']).read()
              values = {key: int(value) for key, value in re.findall(r'^# (pass|fail|skipped) (\d+)$', text, re.M)}
              if 'pass' in values and 'fail' in values:
                  passed, failed, skipped = values['pass'], values['fail'], values.get('skipped', 0)
          print('passed %s failed %s skipped %s' % (passed, failed, skipped),
                file=open(e['GITHUB_STEP_SUMMARY'], 'a'))
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W3',
              'owner': 'W3-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W3-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': None,
              'assertions': [{'id': 'exit-status', 'expected': 'rc 0',
                              'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                              'accepted': e['OUTCOME'] == 'PASS'}],
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$sane"
          }
          LOG="$EVDIR/linux-package.log"
          if [ "$SETUP_RESULT" != success ]; then
            printf 'FAIL prerequisite step did not complete successfully\n' > "$LOG"
            finish_gate linux-package 1 FAIL "prerequisite failure" "$LOG" .github/workflows/package.yml unexecuted 0 -- prerequisites || exit 2
            exit 1
          fi
          if [ "$PLATFORM" != arm64 ] && [ "$PLATFORM" != x64 ]; then
            printf 'Unsupported Linux package architecture: %s\n' "$PLATFORM" > "$LOG"
            finish_gate linux-package UNEXEC BLOCKED "unsupported package architecture" "$LOG" .github/workflows/package.yml unexecuted 0 -- package-arch || exit 2
            exit 1
          fi
          (
            set -e
            : "${MV_PKG_OUT:?external package output is required}"
            : "${CARGO_TARGET_DIR:?private cargo target directory is required}"
            case "$CARGO_TARGET_DIR" in
              /*) ;;
              *) echo "PKG_CARGO_TARGET_REQUIRED" >&2; exit 1 ;;
            esac
            bash .github/workflows/offline.sh bash scripts/bootstrap.sh
            bash .github/workflows/offline.sh node ui/tools/package.js --verify-install "$MV_PKG_OUT/MetaViewer-linux-$PLATFORM"
            smoke="$(bash .github/workflows/offline.sh node ui/tools/package.js --smoke "$MV_PKG_OUT/MetaViewer-linux-$PLATFORM.tar")"
            printf '%s\n' "$smoke"
            grep -Fq '"marker":"METAVIEWER_MAIN_SMOKE_OK"' <<<"$smoke"
          ) > "$LOG" 2>&1
          rc=$?
          outcome=PASS
          [ "$rc" -eq 0 ] || outcome=FAIL
          finish_gate linux-package "$rc" "$outcome" "executed hosted reference" "$LOG" .github/workflows/package.yml "unparsed:node-tap-or-build" 1 -- bash scripts/bootstrap.sh and package verification || exit 2
          exit "$rc"
