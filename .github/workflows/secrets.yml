name: Secrets

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download pinned gitleaks v8.18.4 (checksum verified)
        run: |
          set -euo pipefail
          umask 077
          curl -sSfL --retry 3 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod 700 "$RUNNER_TEMP/gitleaks"
          rm -f "$RUNNER_TEMP/gitleaks.tgz"
      - name: Secrets unit and integration tests
        run: |
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" python3 -I -m unittest discover -s tests/fixtures/secrets -p 'test_*.py' -v
      - name: Secrets gate (history plus controls)
        run: |
          python3 -I tests/fixtures/secrets/gate.py gate --gitleaks "$RUNNER_TEMP/gitleaks" --repo "$GITHUB_WORKSPACE"
