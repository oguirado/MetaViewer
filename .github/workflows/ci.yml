            if [ $r -eq 0 ]; then oc=PASS; rsn="vue-tsc green"; else oc=FAIL; rsn="vue-tsc failed"; fi
            finish_gate js-check "$r" "$oc" "$rsn" "$LOG" ui/tsconfig.json "unparsed:vue-tsc" 0 -- npm run check || rc=2
          fi
