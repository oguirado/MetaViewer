          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/ci.yml","rb").read()).hexdigest())')"
          ISSUER="CI/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
