    outputs:
      receipt_x64: ${{ steps.package-evidence.outputs.receipt_x64 }}
      receipt_arm64: ${{ steps.package-evidence.outputs.receipt_arm64 }}
    # [TARGET, unit decision] Native builds and independent reproduction per arch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Read locked kit identity
        id: kit
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          lock = json.load(open('ui/kit.lock.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          match = re.fullmatch(r'https://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\.git', lock['repo'])
          assert match, 'kit repository is not a GitHub checkout'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + match[1], file=output)
              print('commit=' + lock['commit'], file=output)
          PYEOF
