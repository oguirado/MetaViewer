          import tools.budget_gate as bg
          budgets = bg.load_budgets(pathlib.Path("tests/perf/budgets.json"))
          frozen_caps = {row["id"]: row["bound"] for row in budgets["budgets"] if row["gating"]}
          log_text = pathlib.Path(os.environ["BUDGET_LOG"]).read_text(encoding="utf-8", errors="replace")
          rss_matches = re.findall(r"^RSS_CAPS \[MEASURED\]: (\{.*\})\s*$", log_text, re.M)
          perf_matches = re.findall(r"^PERF_WALL \[MEASURED\]: (\[.*\])\s*$", log_text, re.M)
          failures = []
          rss_caps = {}
          perf_wall = []
          if not rss_matches:
              failures.append("missing_rss_caps_measured")
          else:
              rss_caps = json.loads(rss_matches[-1])
              for key, bound in sorted(frozen_caps.items()):
                  val = rss_caps.get(key)
                  if type(val) is not int or val <= 0:
                      failures.append(f"invalid_{key}")
                  elif val > bound:
                      failures.append(key)
          if not perf_matches:
              failures.append("missing_perf_wall_measured")
          else:
              perf_wall = json.loads(perf_matches[-1])
              if not isinstance(perf_wall, list) or len(perf_wall) < 4:
                  failures.append("perf_wall_tile_count")
              else:
                  for tile in perf_wall:
                      fps = tile.get("fps") if isinstance(tile, dict) else None
                      if not isinstance(fps, (int, float)) or fps < 10.0:
                          failures.append(f"perf_wall_fps:{tile.get('id') if isinstance(tile, dict) else 'unknown'}")
          measured = {
              "schema": "metaviewer.perf.budget-gate-receipt/v1",
              "frozen_budgets_bytes": frozen_caps,
              "min_tile_fps": 10.0,
              "rss_caps_measured": rss_caps,
              "perf_wall_measured": perf_wall,
              "failures": failures,
          }
          with open(os.environ["MEASURED_OUT"], "w", encoding="utf-8") as mf:
              json.dump(measured, mf, indent=2)
          if failures:
              print("FAIL budgets: " + ", ".join(failures))
              sys.exit(1)
          print("PASS budgets: RSS_CAPS and PERF_WALL within frozen bounds")
          PYEOF
          if [ $r -eq 0 ]; then oc=PASS; rsn="AC-14 budget and perf journeys within frozen bounds"; else oc=FAIL; rsn="AC-14 budget gate failed"; fi
          finish_gate budgets "$r" "$oc" "$rsn" "$LOG" tests/perf/budgets.json "unparsed:budget-gate" 0 -- node --test tests/e2e/e2e18_budgets.test.js tests/e2e/e2e14_perf.test.js || r=2
          exit $r
      - name: Aggregate required results
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_RECEIPT: ${{ matrix.platform == 'x64' && needs.package.outputs.receipt_x64 || needs.package.outputs.receipt_arm64 }}
        run: |
          fail=0
          check_distribution="${{ job.status }}"
          [ "$check_distribution" = success ] || fail=1
          check() {
            if [ "$2" != "success" ]; then
              echo "FAIL required job $1: $2"
              fail=1
            else
              echo "PASS required job $1"
            fi
          }
          check ci-policy "${{ needs.ci-policy.result }}"
          check laws-contracts "${{ needs.laws-contracts.result }}"
          check router "${{ needs.router.result }}"
          check rust "${{ needs.rust.result }}"
          check go "${{ needs.go.result }}"
          check python "${{ needs.python.result }}"
          check js "${{ needs.js.result }}"
          check e2e "${{ needs.e2e.result }}"
          check novac "${{ needs.novac.result }}"
          check package "${{ needs.package.result }}"
          if [ -n "${PACKAGE_RECEIPT:-}" ] || [ -n "${MV_REQUIRED_RECEIPTS_DIR:-}" ] || [ -n "${RUNNER_TEMP:-}" ]; then
            python3 - <<'PYEOF' || fail=1
          import json, os, pathlib, re, sys
          HEX = re.compile(r'^[0-9a-f]{64}$')
          SHA = re.compile(r'^[0-9a-f]{40}$')
          FORBIDDEN = {'timestamp', 'started_at', 'finished_at', 'duration_ms', 'pid', 'ppid', 'hostname', 'runner_name', 'temp_dir'}
          def check_receipt(r):
              if not isinstance(r, dict): return ['not an object']
              if FORBIDDEN & set(r): return ['forbidden volatile keys']
              if r.get('schema') != 'gate_receipt/v1': return ['bad schema']
              if r.get('outcome') not in ('PASS', 'FAIL', 'TIMEOUT', 'BLOCKED'): return ['bad outcome']
              ident = r.get('identities')
              if not isinstance(ident, dict): return ['bad identities']
              if not SHA.match(str(ident.get('gate_revision', ''))): return ['bad gate_revision']
              for k in ('instrument_sha256', 'sanitized_log_sha256', 'configuration_sha256'):
                  if not HEX.match(str(ident.get(k, ''))): return ['bad ' + k]
              counts = r.get('counts')
              if not isinstance(counts, dict): return ['bad counts']
              src = counts.get('source', '')
              if str(src).startswith('parsed:') and (type(counts.get('passed')) is not int or counts.get('passed', 0) <= 0):
                  return ['parsed count must have passed > 0']
              if r.get('outcome') == 'PASS' and r.get('rc') != 0: return ['PASS requires rc 0']
              if r.get('outcome') != 'PASS': return ['non-PASS outcome: ' + str(r.get('outcome'))]
              assertions = r.get('assertions')
              if not isinstance(assertions, list) or not assertions or not all(isinstance(a, dict) and a.get('accepted') is True for a in assertions):
                  return ['unaccepted assertions']
              return []
          receipts = []
          pkg_raw = os.environ.get('PACKAGE_RECEIPT', '').strip()
          if pkg_raw:
              try:
                  receipts.append(('package', json.loads(pkg_raw)))
              except Exception as exc:
                  print(f'FAIL required receipt package: {exc}')
                  sys.exit(1)
          for base in [os.environ.get('MV_REQUIRED_RECEIPTS_DIR', '').strip(),
                       os.path.join(os.environ['RUNNER_TEMP'], 'metaviewer-ci', 'ci-required', os.environ.get('PLATFORM', 'x64'))
                       if os.environ.get('RUNNER_TEMP') else '']:
              if base and os.path.isdir(base):
                  for p in sorted(pathlib.Path(base).rglob('*.receipt.json')):
                      try:
                          receipts.append((p.name, json.loads(p.read_text(encoding='utf-8'))))
                      except Exception as exc:
                          print(f'FAIL required receipt {p.name}: {exc}')
                          sys.exit(1)
          errs = []
          for name, rec in receipts:
              e = check_receipt(rec)
              if e:
                  print(f'FAIL required receipt {name}: {e}')
                  errs.extend(e)
          if errs:
              sys.exit(1)
          PYEOF
          fi
          {
            echo "## ci-required [VM] rc $fail"
            if [ $fail -eq 0 ]; then echo "outcome PASS: every required job succeeded"; else echo "outcome FAIL: a required job failed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

