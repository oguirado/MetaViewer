            [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
            blocked js-check "npm ci failed" ui/package.json -- npm run check; r=$?
            [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
            blocked js-build "npm ci failed" ui/package.json -- npm run build; r=$?
            [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
            exit $rc
          fi
          # Electron has no npm postinstall hook; the ASAR test needs its real binary.
          # Bootstrap the checksum-verified archive, then require the installer
          # and its xvfb version probe to pass in the test network namespace.
          LOG="$EVDIR/js-electron.log"
          ( node .github/workflows/install_electron.cjs && offline timeout 1200 node .github/workflows/install_electron.cjs ) >"$LOG" 2>&1; r=$?
          if [ $r -eq 0 ]; then oc=PASS; rsn="pinned Electron verified"; else oc=FAIL; rsn="Electron installation failed"; fi
          finish_gate js-electron "$r" "$oc" "$rsn" "$LOG" .github/workflows/install_electron.cjs "unparsed:electron-install" 0 -- offline timeout 1200 node .github/workflows/install_electron.cjs || rc=2
