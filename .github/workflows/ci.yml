          if [ ! -f ui/index.html ]; then
            blocked js-build "ui/index.html missing, owned by R-W0-SHELL" ui/package.json -- npm run build; r=$?
          else
            LOG="$EVDIR/js-build.log"
            : > "$LOG"
            ( cd ui && offline timeout 1200 npm run build >"$LOG" 2>&1 ); r=$?
            if [ $r -eq 0 ]; then oc=PASS; rsn="vite build green"; else oc=FAIL; rsn="vite build failed"; fi
            finish_gate js-build "$r" "$oc" "$rsn" "$LOG" ui/index.html "unparsed:vite-build" 0 -- npm run build || rc=2
          fi
          [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
          exit $rc

