# MetaViewer unified CI (W0-CI-MATRIX).
# [TARGET, unit decision] Product identity requires aggregator-local bytes;
# producer log digests are labeled sanitized_log_sha256 and prove no product.
#
# Branch protection (set by the maintainer in the hosting UI; comments do not
# configure it): require the `ci-required` status plus the separately owned
# `Secrets / secrets` status on `main`, fast-forward merges only from green.
# Optional build-only jobs (build-macos, build-windows; manual or integration/main push) and the nightly volume workflow
# are never required statuses.
#
# Host-only by design (never in this file): sealed-toolchain capsule runs,
# live X/docker/capsule runs, secret scanning (sibling secrets.yml), and any
# test needing host credentials. Runner numbers are [VM], never host evidence.
#
# Actions are pinned to full commit SHAs with a human version comment; the
# ci-policy job fails on any floating tag, branch ref, or abbreviated hash.
# No artifact-upload action is used: no verified 40-char SHA for an upload
# action exists in the surveyed corpus, so receipts stay on the runner and are
# mirrored into $GITHUB_STEP_SUMMARY instead of published artifacts.
#
# Matrix legs run on ubuntu-24.04 (x64) and ubuntu-24.04-arm (arm64) with
# fail-fast false. Each leg verifies its own architecture; an arm64 leg that
# never schedules cannot diagnose itself, so missing arm64 execution stays
# BLOCKED in the acceptance record, never silent green.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - name: Resolve runner YAML parser
        run: |
          set -euo pipefail
          yaml_python=""
          while IFS= read -r candidate; do
            if "$candidate" -c 'import yaml' 2>/dev/null; then
              yaml_python="$candidate"
              break
            fi
          done < <(type -aP python3)
          test -n "$yaml_python" || { echo 'PyYAML runner prerequisite absent' >&2; exit 2; }
          echo "MV_YAML_PYTHON=$yaml_python" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5.6.0
        with:
          python-version: "3.12.3"
      - name: Run policy fixtures
        env:
          JOB_ID: ci-policy
          PLATFORM: x64
        run: |
          set +e
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/ci.yml","rb").read()).hexdigest())')"
          ISSUER="CI/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              text = re.sub(re.escape(prefix).replace('_', '(?:_|%5[fF])') + r'(?:[A-Za-z0-9_\-]|%[0-9a-fA-F]{2}){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W0',
              'owner': 'W0-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W0-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': None,
              'assertions': [{'id': 'exit-status', 'expected': 'rc 0',
                              'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                              'accepted': e['OUTCOME'] == 'PASS'}],
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$sane"
          }
          blocked() {
            local gate="$1" reason="$2" fixture="$3"
            shift 3
            [ "${1:-}" = "--" ] && shift
            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          LOG="$EVDIR/ci-policy.log"
          : > "$LOG"
          python3 - <<'PYEOF' >>"$LOG" 2>&1
          import glob, hashlib, json, os, pathlib, re, sys
          fails = []
          passed = 0
          def check(name, cond, detail=""):
              global passed
              if cond:
                  passed += 1
                  print("PASS " + name)
              else:
                  fails.append(name)
                  print("FAIL " + name + (" " + detail if detail else ""))
          ci = open(".github/workflows/ci.yml").read()
          vol = open(".github/workflows/volume.yml").read()
          def top_block_keys(text, key):
              lines = text.splitlines()
              start = next(i for i, l in enumerate(lines) if l == key + ":")
              keys = []
              for line in lines[start + 1:]:
                  if re.match(r"^[A-Za-z]", line):
                      break
                  m = re.match(r"^  ([A-Za-z_][\w-]*):", line)
                  if m:
                      keys.append(m.group(1))
              return keys
          # F1: triggers, permissions, concurrency, timeouts.
          check("f1-ci-triggers", {"push", "pull_request", "workflow_dispatch"} <= set(top_block_keys(ci, "on")))
          von = set(top_block_keys(vol, "on"))
          check("f1-vol-triggers", von == {"schedule", "workflow_dispatch"}, repr(sorted(von)))
          check("f1-permissions", "contents: read" in ci and "contents: read" in vol)
          cig = re.search(r"^concurrency:\n  group: (\S+)", ci, re.M).group(1)
          volg = re.search(r"^concurrency:\n  group: (\S+)", vol, re.M).group(1)
          check("f1-groups", cig != volg and "ci-" in cig and "volume-" in volg, cig + " / " + volg)
          check("f1-cancel", ci.count("cancel-in-progress: true") >= 1 and "cancel-in-progress: true" in vol)
          def job_timeouts(text):
              lines = text.splitlines()
              start = next(i for i, l in enumerate(lines) if l == "jobs:")
              jobs = {}
              cur = None
              for line in lines[start + 1:]:
                  m = re.match(r"^  ([\w-]+):\s*$", line)
                  if m:
                      cur = m.group(1)
                      jobs[cur] = None
                  elif cur is not None:
                      t = re.match(r"^    timeout-minutes: (\d+)\s*$", line)
                      if t:
                          jobs[cur] = int(t.group(1))
              return jobs
          def job_block(text, job):
              lines = text.splitlines()
              start = next(i for i, l in enumerate(lines) if l == "  " + job + ":")
              buf = []
              for line in lines[start + 1:]:
                  if re.match(r"^  [\w-]+:\s*$", line):
                      break
                  buf.append(line)
              return "\n".join(buf)
          cjobs = job_timeouts(ci)
          vjobs = job_timeouts(vol)
          check("f1-ci-jobs", set(cjobs) >= {"ci-policy", "laws-contracts", "router", "rust", "go", "python", "js", "e2e",
                                             "novac", "package", "build-macos", "build-windows", "ci-required"},
                repr(sorted(cjobs)))
          check("f1-ci-timeouts", all(v == 25 for v in cjobs.values()), repr(cjobs))
          check("f1-vol-jobs", set(vjobs) >= {"volume-property", "volume-mutants", "volume-e2e"}, repr(sorted(vjobs)))
          # [TARGET, unit decision] Keep the longer qualification leg's existing
          # budget: volume.yml runs the AC-13 qualification after E2E smoke;
          # tests/test_ci_volume_e2e.py guards both loops and their ordering.
          volume_timeouts = {"volume-property": 60, "volume-mutants": 60, "volume-e2e": 180}
          check("f1-vol-timeouts", vjobs == volume_timeouts, repr(vjobs))
          for job, minutes in volume_timeouts.items():
              mutant = dict(volume_timeouts, **{job: minutes + 1})
              check("f1-neg-vol-timeout-" + job, mutant != volume_timeouts)
          mut_vol = "on:\n  schedule:\n  pull_request:\n"
          check("f1-neg-vol-trigger", set(top_block_keys(mut_vol, "on")) != {"schedule", "workflow_dispatch"})
          mut_jobs = "jobs:\n  lone:\n    runs-on: x\n"
          check("f1-neg-timeout", job_timeouts(mut_jobs).get("lone") != 60)
          # F2: full-SHA action pins over every workflow file.
          def pin_errors(text, root, checker_src=None):
              import subprocess
              checker = os.path.join(os.environ.get("GITHUB_WORKSPACE", os.getcwd()),
                                     ".github/workflows/workflow_pins.py")
              cmd = ([os.environ.get("MV_YAML_PYTHON", "python3"), "-c", checker_src, root]
                     if checker_src is not None else
                     [os.environ.get("MV_YAML_PYTHON", "python3"), checker, root])
              result = subprocess.run(cmd, input=text, capture_output=True, text=True, timeout=30)
              if result.returncode:
                  return ["YAML checker unavailable: " + result.stderr]
              try:
                  errors = json.loads(result.stdout)
                  return errors if isinstance(errors, list) else ["invalid checker result"]
              except ValueError:
                  return ["invalid checker result"]
          real = []
          for path in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              with open(path) as workflow:
                  real += ["%s: %s" % (path, e) for e in pin_errors(workflow.read(), ".")]
          check("f2-pinned", real == [], "; ".join(real[:4]))
          good = "steps:\n  - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2\n"
          check("f2-pos", pin_errors(good, ".") == [])
          bads = ["- uses: actions/checkout@v4\n", "- uses: actions/checkout@main\n",
                  "- uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68\n",
                  "- uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68399\n",
                  "- uses: ./actions/does-not-exist\n",
                  "- uses: other/repo/.github/workflows/x.yml@v1\n"]
          check("f2-neg", all(pin_errors("s:\n" + b, ".") != [] for b in bads))
          check("f2-neg-local", pin_errors("s:\n- uses: ./tools\n", ".") != [])
          import pathlib
          pins_file = os.path.join(os.environ.get("GITHUB_WORKSPACE", os.getcwd()),
                                   ".github/workflows/workflow_pins.py")
          mutant_pins_src = pathlib.Path(pins_file).read_text().replace("{40}", "{7,40}")
          broken = lambda text, root, _src=mutant_pins_src, _fn=pin_errors: _fn(text, root, _src)
          check("f2-mutant-caught", pin_errors("s:\n" + bads[2], ".") != [] and broken("s:\n" + bads[2], ".") == []
                and broken(good, ".") == [] and broken("steps: [broken", ".") != [])
          # F3 executes the same range selector used by the laws job.
          import subprocess
          range_tests = subprocess.run(["python3", "-I", "-m", "unittest", "discover",
              "-s", ".github/workflows", "-p", "test_laws_range.py", "-v"], capture_output=True, text=True)
          check("f3-range-tests", range_tests.returncode == 0, range_tests.stdout + range_tests.stderr)
          laws_block = job_block(ci, "laws-contracts")
          bare = False
          for line in laws_block.splitlines():
              code = re.sub(r'"[^"]*"', '""', line)
              if re.search(r"\$(?:BEFORE|HEAD|PR_BASE|PR_HEAD|EVENT_NAME)\b", code):
                  bare = True
          check("f3-neg-quoted", not bare and '"$BEFORE"' in laws_block)
          # F4: receipt schema validation and required-set aggregation.
          RKEYS = {"schema", "gate_id", "leg", "profile", "owner", "issuer", "scope", "argv", "cwd",
                   "rc", "outcome", "reason", "identities", "product_identity", "assertions", "counts"}
          OUTCOMES = {"PASS", "FAIL", "BLOCKED", "UNKNOWN", "NOT_APPLICABLE"}
          def receipt_errors(r, reg):
              errs = []
              if not isinstance(r, dict) or set(r) != RKEYS:
                  errs.append("keys")
                  return errs
              if r["schema"] != "gate_receipt/v1":
                  errs.append("schema")
              for k in ("gate_id", "leg", "profile", "owner", "issuer", "reason", "cwd"):
                  if not isinstance(r[k], str) or not r[k]:
                      errs.append(k)
              if r["outcome"] not in OUTCOMES:
                  errs.append("outcome")
              if r["outcome"] in ("PASS", "FAIL"):
                  if type(r["rc"]) is not int:
                      errs.append("rc-int")
                  elif r["outcome"] == "PASS" and r["rc"] != 0:
                      errs.append("rc-pass")
                  elif r["outcome"] == "FAIL" and r["rc"] == 0:
                      errs.append("rc-fail")
              elif r["rc"] is not None:
                  errs.append("rc-null")
              if not isinstance(r["argv"], list) or not r["argv"] or any(not isinstance(a, str) or not a for a in r["argv"]):
                  errs.append("argv")
              if not isinstance(r["scope"], dict) or set(r["scope"]) != {"unit", "platform", "feature", "artifact"} or any(not isinstance(v, str) or not v for v in r["scope"].values()):
                  errs.append("scope")
              ids = r["identities"]
              if not isinstance(ids, dict) or set(ids) != {"gate_revision", "instrument_sha256", "sanitized_log_sha256", "configuration_sha256",
                               "log_sha256", "fixture_sha256"}:
                  errs.append("identities-keys")
                  return errs
              hexok = lambda v: isinstance(v, str) and re.fullmatch(r"[0-9a-f]{64}", v) is not None
              for k in ("instrument_sha256", "sanitized_log_sha256", "configuration_sha256", "log_sha256"):
                  if not hexok(ids[k]):
                      errs.append("identities-" + k)
              if not isinstance(ids["fixture_sha256"], list) or not ids["fixture_sha256"] or any(not hexok(v) for v in ids["fixture_sha256"]):
                  errs.append("fixture_sha256")
              if not isinstance(r["assertions"], list) or not r["assertions"]:
                  errs.append("assertions-empty")
              else:
                  for a in r["assertions"]:
                      if not isinstance(a, dict) or set(a) != {"id", "expected", "observed", "accepted"} or type(a["accepted"]) is not bool:
                          errs.append("assertion-shape")
                      elif r["outcome"] == "PASS" and not a["accepted"]:
                          errs.append("assertion-unaccepted")
              c = r["counts"]
              if not isinstance(c, dict) or set(c) != {"passed", "failed", "skipped", "source"} or not isinstance(c["source"], str) or not c["source"]:
                  errs.append("counts")
              else:
                  vals = [c[k] for k in ("passed", "failed", "skipped")]
                  for k in ("passed", "failed", "skipped"):
                      if c[k] is not None and (type(c[k]) is not int or c[k] < 0):
                          errs.append("counts-" + k)
                  if any(v is None for v in vals) and not all(v is None for v in vals):
                      errs.append("counts-inconsistent")
                  elif all(type(v) is int and v >= 0 for v in vals):
                      if r["outcome"] == "PASS" and (c["failed"] != 0 or sum(vals) <= 0):
                          errs.append("counts-failed-pass")
                  elif c["source"].startswith("parsed:") and r["outcome"] == "PASS":
                      errs.append("counts-unparsed-pass")
              for k, v in reg.items():
                  if ids.get(k) != v:
                      errs.append("oracle-" + k)
              return errs
          import hashlib, pathlib
          genuine = {"schema": "gate_receipt/v1", "gate_id": "g", "leg": "g", "profile": "W0",
                     "owner": "W0-CI-MATRIX", "issuer": "CI/g/1 [VM]", "argv": ["true"], "cwd": "/tmp",
                     "rc": 0, "outcome": "PASS", "reason": "ok",
                     "scope": {"unit": "u", "platform": "x64", "feature": "g", "artifact": "g.receipt.json"},
                     "identities": {"gate_revision": "r", "instrument_sha256": "a" * 64, "sanitized_log_sha256": "b" * 64,
                                    "configuration_sha256": hashlib.sha256(pathlib.Path(".github/workflows/ci.yml").read_bytes()).hexdigest(),
                                    "log_sha256": "d" * 64, "fixture_sha256": ["a" * 64]},
                     "product_identity": None,
                     "assertions": [{"id": "exit-status", "expected": "rc 0", "observed": "rc 0", "accepted": True}],
                     "counts": {"passed": 1, "failed": 0, "skipped": 0, "source": "parsed:true"}}
          reg = {"instrument_sha256": "a" * 64, "sanitized_log_sha256": "b" * 64,
                 "configuration_sha256": genuine["identities"]["configuration_sha256"],
                 "log_sha256": "d" * 64}
          check("f4-genuine", receipt_errors(genuine, reg) == [], repr(receipt_errors(genuine, reg)[:3]))
          tampered = json.loads(json.dumps(genuine))
          tampered["identities"]["sanitized_log_sha256"] = "0" * 64
          check("f4-neg-tamper", receipt_errors(tampered, reg) != [])
          missing = json.loads(json.dumps(genuine))
          del missing["reason"]
          check("f4-neg-missing", receipt_errors(missing, reg) != [])
          extra = json.loads(json.dumps(genuine))
          extra["zzz"] = 1
          check("f4-neg-extra", receipt_errors(extra, reg) != [])
          nullpass = json.loads(json.dumps(genuine))
          nullpass["rc"] = None
          check("f4-neg-null-pass", receipt_errors(nullpass, reg) != [])
          rc7pass = json.loads(json.dumps(genuine))
          rc7pass["rc"] = 7
          check("f4-neg-rc-pass", receipt_errors(rc7pass, reg) != [])
          unacc = json.loads(json.dumps(genuine))
          unacc["assertions"][0]["accepted"] = False
          check("f4-neg-unaccepted", receipt_errors(unacc, reg) != [])
          failcnt = json.loads(json.dumps(genuine))
          failcnt["counts"]["failed"] = 1
          check("f4-neg-failed-count", receipt_errors(failcnt, reg) != [])
          negcnt = json.loads(json.dumps(genuine))
          negcnt["counts"]["passed"] = -1
          check("f4-neg-neg-count", receipt_errors(negcnt, reg) != [])
          blocked = json.loads(json.dumps(genuine))
          blocked.update({"rc": None, "outcome": "BLOCKED", "reason": "no runner"})
          blocked["assertions"] = [{"id": "exit-status", "expected": "rc 0", "observed": "unexecuted", "accepted": False}]
          check("f4-blocked", receipt_errors(blocked, reg) == [])
          # [TARGET, unit decision] Share the byte verifier with ci-required.
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("package_identity", "tests/ci/test_package_identity.py")
          product_module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(product_module)
          distribution_errors = product_module.distribution_errors
          def aggregate(required, receipts, results, product_root=None, revision=None, reg=None):
              import hashlib, os, pathlib
              seen = [r.get("gate_id") for r in receipts if isinstance(r, dict)]
              if len(seen) != len(receipts) or sorted(seen) != sorted(required):
                  return (False, "identity-set")
              ci_path = os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), ".github/workflows/ci.yml")
              oracle = {"configuration_sha256": hashlib.sha256(pathlib.Path(ci_path).read_bytes()).hexdigest()}
              if reg:
                  oracle.update(reg)
              for r in receipts:
                  errs = receipt_errors(r, oracle)
                  if errs:
                      return (False, "receipt-" + str(r.get("gate_id")) + ":" + ",".join(errs))
                  if results.get(r["gate_id"]) != "success":
                      return (False, "job-" + r["gate_id"])
                  if r["outcome"] not in required[r["gate_id"]]:
                      return (False, "outcome-" + r["gate_id"])
                  if r["gate_id"] == "package" and distribution_errors(r, product_root, revision):
                      return (False, "product-package")
              return (True, "ok")
          req = {"rust": {"PASS"}, "novac": {"PASS", "NOT_APPLICABLE"}}
          rpass = json.loads(json.dumps(genuine))
          rpass["gate_id"] = "rust"
          rna = json.loads(json.dumps(genuine))
          rna.update({"gate_id": "novac", "rc": None, "outcome": "NOT_APPLICABLE", "reason": "w1",
                      "assertions": [{"id": "exit-status", "expected": "rc 0", "observed": "unexecuted", "accepted": False}],
                      "counts": {"passed": None, "failed": None, "skipped": None, "source": "unexecuted"}})
          check("f4-agg-ok", aggregate(req, [rpass, rna], {"rust": "success", "novac": "success"})[0])
          check("f4-neg-agg-missing", not aggregate(req, [rpass], {"rust": "success", "novac": "success"})[0])
          check("f4-neg-agg-dup", not aggregate(req, [rpass, rpass, rna], {"rust": "success", "novac": "success"})[0])
          check("f4-neg-agg-job", not aggregate(req, [rpass, rna], {"rust": "failure", "novac": "success"})[0])
          check("f4-neg-agg-skip", not aggregate(req, [rpass, rna], {"rust": "success", "novac": "skipped"})[0])
          rna2 = json.loads(json.dumps(rna))
          rna2["gate_id"] = "rust"
          check("f4-neg-agg-na", not aggregate(req, [rna2, rna], {"rust": "success", "novac": "success"})[0])
          rbad_rc = json.loads(json.dumps(rpass))
          rbad_rc["rc"] = 7
          check("f4-neg-agg-rc", not aggregate(req, [rbad_rc, rna], {"rust": "success", "novac": "success"})[0])
          rbad_cfg = json.loads(json.dumps(rpass))
          rbad_cfg["identities"]["configuration_sha256"] = "f" * 64
          check("f4-neg-agg-cfg", not aggregate(req, [rbad_cfg, rna], {"rust": "success", "novac": "success"})[0])
          product_tests = subprocess.run(["python3", "-m", "unittest", "discover", "-s", "tests/ci",
              "-p", "test_package_identity.py", "-v"], capture_output=True, text=True)
          check("f4-product-identity", product_tests.returncode == 0, product_tests.stdout + product_tests.stderr)
          # F5: runner label to architecture mapping.
          ARCH = {"ubuntu-24.04": "x86_64", "ubuntu-24.04-arm": "aarch64"}
          check("f5-arch", ARCH["ubuntu-24.04"] == "x86_64" and ARCH["ubuntu-24.04-arm"] == "aarch64")
          check("f5-neg-mismatch", ARCH.get("ubuntu-24.04") != "aarch64")
          check("f5-neg-unknown", ARCH.get("ubuntu-20.04") is None)
          # F6: sanitizer redacts synthetic credentials and sentinels, keeps hashes on clean bytes.
          def redact(text):
              for prefix in ("gh" + "p_", "gh" + "s_", "gh" + "o_", "gh" + "u_", "gh" + "r_", "github_" + "pat_", "AK" + "IA", "xox" + "b-", "MV0-SYNTHETIC-SENTINEL-"):
                  text = re.sub(re.escape(prefix).replace("_", "(?:_|%5[fF])") + r"(?:[A-Za-z0-9_\-]|%[0-9a-fA-F]{2}){4,}", "[REDACTED]", text, flags=re.I)
              return text.replace("__MV0_PRIVATE_SOURCE_SENTINEL__", "[REDACTED]")
          synth = "key=" + "gh" + "p_" + "9" * 36 + " tail"
          check("f6-redact", all("[REDACTED]" in redact("key=" + pfx + "9" * 36 + " tail") and "9" * 36 not in redact("key=" + pfx + "9" * 36 + " tail")
                                 for pfx in ("gh" + "p_", "gh" + "s_", "gh" + "o_", "gh" + "u_", "gh" + "r_", "github_" + "pat_", "AK" + "IA", "xox" + "b-")))
          check("f6-sentinel", redact("a MV0-SYNTHETIC-SENTINEL-0001 b __MV0_PRIVATE_SOURCE_SENTINEL__ c") ==
                "a [REDACTED] b [REDACTED] c")
          check("f6-clean-kept", redact("plain line 42") == "plain line 42")
          leaked = [n for n, line in enumerate((ci + vol).splitlines(), 1)
                    if re.search("(" + "gh" + "p_|" + "gh" + "s_|" + "gh" + "o_|" + "gh" + "u_|" + "gh" + "r_|github_" + "pat_|AK" + "IA|xox" + "b-)[A-Za-z0-9]{4,}", line)]
          check("f6-neg-literal", leaked == [], repr(leaked[:4]))
          # F7: summary section shape.
          good_sum = "## rust-fmt [VM] rc 0"
          check("f7-shape", re.match(r"^## [\w\-.]+ \[VM\] rc (UNKNOWN|\d+)$", good_sum) is not None)
          check("f7-neg", re.match(r"^## [\w\-.]+ \[VM\] rc (UNKNOWN|\d+)$", "## rust-fmt rc 0") is None)
          # F8: every tools/*.py referenced by ci.yml exists or is a guarded ABSENT registration.
          refs = set(re.findall(r"tools/[\w\-]+\.py", ci))
          missing = {r for r in refs if not os.path.exists(r)}
          check("f8-claims", missing <= {"tools/router_index.py"}, repr(sorted(missing)))
          check("f8-guard", "BLOCKED" in job_block(ci, "router") and "tools/router_index.py" in job_block(ci, "router"))
          print("policy-fixtures: %d passed, %d failed" % (passed, len(fails)))
          sys.exit(1 if fails else 0)
          PYEOF
          r=$?
          if [ $r -eq 0 ]; then
            finish_gate ci-policy 0 PASS "all policy fixtures green" "$LOG" ".github/workflows/ci.yml" "policy-fixtures" 0 -- python3 - || r=2
          else
            finish_gate ci-policy "$r" FAIL "policy fixture failures" "$LOG" ".github/workflows/ci.yml" "policy-fixtures" 0 -- python3 - || r=2
          fi
          exit $r

  laws-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - name: Download pinned gitleaks v8.18.4 (checksum verified)
        run: |
          set -euo pipefail
          umask 077
          curl -sSfL --retry 3 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod 700 "$RUNNER_TEMP/gitleaks"
          rm -f "$RUNNER_TEMP/gitleaks.tgz"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      # [TARGET, unit decision] Reuse the corpus pin from volume.yml; select
      # the module toolchain before priming caches outside the offline namespace.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # setup-go v5
        with:
          go-version-file: daemon-adapter/go.mod
          cache: false
      - name: Prime Go module and build caches
        working-directory: daemon-adapter
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod download
          export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=readonly
          go build ./...
          go test -race -run '^$' ./...
      - name: Resolve runner YAML parser
        run: |
          set -euo pipefail
          yaml_python=""
          while IFS= read -r candidate; do
            if "$candidate" -c 'import yaml' 2>/dev/null; then
              yaml_python="$candidate"
              break
            fi
          done < <(type -aP python3)
          test -n "$yaml_python" || { echo 'PyYAML runner prerequisite absent' >&2; exit 2; }
          echo "MV_YAML_PYTHON=$yaml_python" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5.6.0
        with:
          python-version: "3.12.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node v4.4.0
        with:
          node-version: "24.14.0"
      # [TARGET, unit decision] These tests compile Rust drivers and validate
      # frozen offline resolution; provision their toolchain/cache explicitly.
      - name: Prepare pinned Rust formatter
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt
      - name: Prepare Rust for offline checks
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          cargo fetch --locked
      - name: Prime npm cache for frozen manifest checks
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Rust lint component
        run: rustup component add clippy --toolchain 1.97.0
      - name: Require build network namespace
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/workflows/offline.sh true
      # Keep the explicit selected-binary check as well as setup-go: a broken
      # module selection must never publish a fallback toolchain to later steps.
      - name: Select adapter Go toolchain
        run: |
          set -euo pipefail
          version="$(awk '$1 == "go" {print $2}' daemon-adapter/go.mod)"
          test -n "$version"
          toolchain_root="$(GOTOOLCHAIN="go${version}" go env GOROOT)"
          test -x "${toolchain_root}/bin/go"
          "${toolchain_root}/bin/go" version
          echo "${toolchain_root}/bin" >> "$GITHUB_PATH"
      - name: Run laws and contracts gates
        env:
          JOB_ID: laws-contracts
          PLATFORM: x64
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/ci.yml","rb").read()).hexdigest())')"
          ISSUER="CI/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              text = re.sub(re.escape(prefix).replace('_', '(?:_|%5[fF])') + r'(?:[A-Za-z0-9_\-]|%[0-9a-fA-F]{2}){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W0',
              'owner': 'W0-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W0-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': None,
              'assertions': [{'id': 'exit-status', 'expected': 'rc 0',
                              'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                              'accepted': e['OUTCOME'] == 'PASS'}],
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$sane"
          }
          blocked() {
            local gate="$1" reason="$2" fixture="$3"
            shift 3
            [ "${1:-}" = "--" ] && shift
            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          rc=0
          LOG="$EVDIR/laws-range.log"
          : > "$LOG"
          : "$BEFORE" # Already exported by the step env.
          if RANGE=$(python3 .github/workflows/laws_range.py 2>"$LOG") && { [ -z "$RANGE" ] || { git rev-parse --verify "${RANGE%..*}^{commit}" >/dev/null 2>>"$LOG" && git rev-parse --verify "${RANGE#*..}^{commit}" >/dev/null 2>>"$LOG"; }; }; then
            if [ -n "$RANGE" ]; then
              set -- python3 tools/check_laws.py --range "$RANGE"
            else
              set -- python3 tools/check_laws.py
            fi
            timeout 1200 "$@" >"$LOG" 2>&1; r=$?
            if [ $r -eq 0 ]; then oc=PASS; rsn="laws history check green"; else oc=FAIL; rsn="laws history check failed"; fi
            finish_gate laws-range "$r" "$oc" "$rsn" "$LOG" tools/check_laws.py "unparsed:check_laws" 0 -- "$@" || rc=2
            [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
          else
            blocked laws-range "laws range selection failed" .github/workflows/laws_range.py -- python3 .github/workflows/laws_range.py || r=$?
            [ "${r:-2}" -ne 0 ] && [ $rc -eq 0 ] && rc=${r:-2}
          fi
          LOG="$EVDIR/laws-version.log"
          : > "$LOG"
          set -- python3 tools/check_laws.py --version
          timeout 1200 "$@" >"$LOG" 2>&1; r=$?
          if [ $r -eq 0 ]; then oc=PASS; rsn="version check green"; else oc=FAIL; rsn="version check failed"; fi
          finish_gate laws-version "$r" "$oc" "$rsn" "$LOG" tools/check_laws.py "unparsed:check_laws" 0 -- "$@" || rc=2
          [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
          LOG="$EVDIR/contracts.log"
          : > "$LOG"
          set -- python3 tools/check_contracts.py
          timeout 1200 "$@" >"$LOG" 2>&1; r=$?
          if [ $r -eq 0 ]; then oc=PASS; rsn="contracts check green"; else oc=FAIL; rsn="contracts check failed"; fi
          finish_gate contracts "$r" "$oc" "$rsn" "$LOG" tools/check_contracts.py "unparsed:check_contracts" 0 -- "$@" || rc=2
          [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
          LOG="$EVDIR/unittest-root.log"
          : > "$LOG"
          set -- python3 -m unittest discover -s tests -v
          timeout 1200 "$@" >"$LOG" 2>&1; r=$?
          if [ $r -eq 0 ]; then oc=PASS; rsn="root suite green"; else oc=FAIL; rsn="root suite failed"; fi
          finish_gate unittest-root "$r" "$oc" "$rsn" "$LOG" tests/test_check_laws.py "parsed:unittest" 1 -- "$@" || rc=2
          [ $r -ne 0 ] && [ $rc -eq 0 ] && rc=$r
          exit $rc
