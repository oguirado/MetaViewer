            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          if [ "$(uname -m)" != "$EXPECT_ARCH" ]; then
            blocked js-arch "arch mismatch: expected $EXPECT_ARCH" .github/workflows/ci.yml -- uname -m
            exit 2
          fi
          if [ ! -f ui/package.json ]; then
            blocked js-prereq "ui/package.json missing" .github/workflows/ci.yml -- npm --version
            exit 2
          fi
          if ! command -v npm >/dev/null 2>&1; then
            blocked js-prereq "npm not installed on runner" ui/package.json -- npm --version
            exit 2
          fi
          echo "toolchain: $(node --version 2>&1) / $(npm --version 2>&1)"
          GCWD="$PWD/ui"
          rc=0
          LOG="$EVDIR/js-kit.log"
          : > "$LOG"
