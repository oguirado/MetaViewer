              rss_caps = measured.get('rss_caps_measured') or {}
              for key, bound in sorted((measured.get('frozen_budgets_bytes') or {}).items()):
                  val = rss_caps.get(key)
                  ok_val = type(val) is int and 0 < val <= bound and e['OUTCOME'] == 'PASS'
                  assertions.append({
                      'id': key,
                      'expected': '<= %d' % bound,
                      'observed': '%s [MEASURED]' % val,
                      'accepted': bool(ok_val),
