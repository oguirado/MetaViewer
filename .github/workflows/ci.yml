  ci-required:
    # [TARGET, unit decision] Native builds and independent reproduction per arch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    needs: [ci-policy, laws-contracts, router, rust, go, python, js, e2e, novac, package]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Read locked kit identity
        id: kit
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          lock = json.load(open('ui/kit.lock.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          match = re.fullmatch(r'https://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\.git', lock['repo'])
          assert match, 'kit repository is not a GitHub checkout'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + match[1], file=output)
              print('commit=' + lock['commit'], file=output)
          PYEOF
      - name: Require kit access
        env:
          KIT_REPO_TOKEN: ${{ secrets.KIT_REPO_TOKEN }}
        run: test -n "$KIT_REPO_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.commit }}
          token: ${{ secrets.KIT_REPO_TOKEN }}
          path: kit-checkout
          persist-credentials: false
      - name: Canonicalize checkout origin for lock verification
        run: |
          origin="$(git -C kit-checkout remote get-url origin)"
          git -C kit-checkout remote set-url origin "${origin%.git}.git"
      - name: Prime locked dependencies
        working-directory: ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare verified Electron and offline namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/workflows/offline.sh npm --prefix ui ci --offline --ignore-scripts --no-audit --no-fund
          node .github/workflows/install_electron.cjs
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # setup-go v5
        with:
          go-version-file: daemon-adapter/go.mod
          cache: false
      - name: Prime Go module and build caches
        working-directory: daemon-adapter
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod download
          export GOPROXY=off GOSUMDB=off GOFLAGS=-mod=readonly
          go build ./...
          go test -race -run '^$' ./...
      - name: Prime native toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          cargo fetch --locked
          (cd daemon-adapter && go mod download)
          command -v xvfb-run
          command -v strace
          command -v zip
      - name: Rebuild independent package bytes
        env:
          PLATFORM: ${{ matrix.platform }}
          MV_PKG_OUT: ${{ runner.temp }}/metaviewer-products
          CAPSULE_UI_KIT_REPO: ${{ github.workspace }}/kit-checkout
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/ui/node_modules/electron/dist
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-cargo-target
        run: python3 tests/ci/test_package_identity.py --build
      - name: Verify independent package product
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_RECEIPT: ${{ matrix.platform == 'x64' && needs.package.outputs.receipt_x64 || needs.package.outputs.receipt_arm64 }}
          PRODUCT_ROOT: ${{ runner.temp }}/metaviewer-products
        run: |
          # [TARGET, unit decision] Path 2B: reproduce and smoke local bytes;
          # compare against the producer receipt without an artifact action.
          python3 tests/ci/test_package_identity.py --distribution
      - name: Run AC-14 budget gate
        env:
          JOB_ID: ci-required
          PLATFORM: ${{ matrix.platform }}
          CAPSULE_UI_KIT_REPO: ${{ github.workspace }}/kit-checkout
          MV_KIT_CHECKOUT: ${{ github.workspace }}/kit-checkout
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/ui/node_modules/electron/dist
