# MetaViewer nightly volume reports (W0-CI-MATRIX).
#
# Triggers on schedule plus manual dispatch ONLY; never on push or pull
# request, and never a required branch-protection status. Failures here stay
# visible as FAIL/BLOCKED reports without blocking `main`.
#
# Workloads (strategy targets): property tests at 100000 cases, contract
# mutants x100, E2E repeat x20, on both x64 and arm64 legs. The exact
# invocation and seed interfaces are ABSENT in W0, so each job probes its
# registered entrypoint and reports BLOCKED until the owning wave registers
# the interface. No invented flags, no unbounded loops.
#
# Same evidence rules as ci.yml: full-SHA action pins, sanitized logs,
# gate_receipt/v1 receipts on the runner mirrored into $GITHUB_STEP_SUMMARY,
# runner numbers labelled [VM].
name: Volume
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volume-${{ github.ref }}
  cancel-in-progress: true
jobs:
  volume-property:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5.6.0
        with:
          python-version: "3.12.3"
      - name: Probe property entrypoint
        env:
          JOB_ID: volume-property
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/volume.yml","rb").read()).hexdigest())')"
          ISSUER="Volume/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              p_pat = r'(?:\\?\r?\n)?'.join(r'(?:%s|%%(?:25)*(?:%02x|%02x))' % (re.escape(c), ord(c.lower()), ord(c.upper())) for c in prefix)
              text = re.sub(p_pat + r'(?:[A-Za-z0-9_\-]|%(?:25)*[0-9a-fA-F]{2}|\\\r?\n){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          measured_path = os.path.join(e['EVDIR'], e['GATE'] + '.measured.json')
          measured = json.load(open(measured_path)) if os.path.exists(measured_path) else None
          assertions = [{'id': 'exit-status', 'expected': 'rc 0',
                         'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                         'accepted': e['OUTCOME'] == 'PASS'}]
          if isinstance(measured, dict) and isinstance(measured.get('tiles'), list):
              import math
              for tile in measured['tiles']:
                  tid = str(tile.get('id', 'tile'))
                  raw_frames = tile.get('frames', 0)
                  raw_stalls = tile.get('stalls', 0)
                  raw_fps = tile.get('fps', 0.0)
                  frames = raw_frames if type(raw_frames) is int and raw_frames >= 0 else 0
                  stalls = raw_stalls if type(raw_stalls) is int and raw_stalls >= 0 else 1
                  fps_ok = not isinstance(raw_fps, bool) and isinstance(raw_fps, (int, float)) and math.isfinite(float(raw_fps))
                  fps = float(raw_fps) if fps_ok else 0.0
                  assertions.append({
                      'id': 'soak-tile-' + tid,
                      'expected': 'fps>=10.0 and stalls==0',
                      'observed': 'frames=%d fps=%s stalls=%d [MEASURED]' % (frames, ('%.2f' % fps) if fps_ok else 'non-finite', stalls),
                      'accepted': bool(fps_ok and fps >= 10.0 and stalls == 0 and e['OUTCOME'] == 'PASS'),
                  })
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W0',
              'owner': 'W0-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W0-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': measured,
              'assertions': assertions,
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          blocked() {
            local gate="$1" reason="$2" fixture="$3"
            shift 3
            [ "${1:-}" = "--" ] && shift
            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          ENTRY="tools/volume_property.py"
          if [ ! -f "$ENTRY" ]; then
            blocked volume-property "no registered property entrypoint for 100000 cases, owned by a future wave" .github/workflows/volume.yml -- python3 tools/volume_property.py
            exit 2
          fi
          blocked volume-property "entrypoint present but the registered 100000-case interface is ABSENT" tools/volume_property.py -- python3 tools/volume_property.py
          exit 2
  volume-mutants:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5.6.0
        with:
          python-version: "3.12.3"
      - name: Run contract mutants x100
        env:
          JOB_ID: volume-mutants
          PLATFORM: ${{ matrix.platform }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/volume.yml","rb").read()).hexdigest())')"
          ISSUER="Volume/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              p_pat = r'(?:\\?\r?\n)?'.join(r'(?:%s|%%(?:25)*(?:%02x|%02x))' % (re.escape(c), ord(c.lower()), ord(c.upper())) for c in prefix)
              text = re.sub(p_pat + r'(?:[A-Za-z0-9_\-]|%(?:25)*[0-9a-fA-F]{2}|\\\r?\n){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          measured_path = os.path.join(e['EVDIR'], e['GATE'] + '.measured.json')
          measured = json.load(open(measured_path)) if os.path.exists(measured_path) else None
          assertions = [{'id': 'exit-status', 'expected': 'rc 0',
                         'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                         'accepted': e['OUTCOME'] == 'PASS'}]
          if isinstance(measured, dict) and isinstance(measured.get('tiles'), list):
              import math
              for tile in measured['tiles']:
                  tid = str(tile.get('id', 'tile'))
                  raw_frames = tile.get('frames', 0)
                  raw_stalls = tile.get('stalls', 0)
                  raw_fps = tile.get('fps', 0.0)
                  frames = raw_frames if type(raw_frames) is int and raw_frames >= 0 else 0
                  stalls = raw_stalls if type(raw_stalls) is int and raw_stalls >= 0 else 1
                  fps_ok = not isinstance(raw_fps, bool) and isinstance(raw_fps, (int, float)) and math.isfinite(float(raw_fps))
                  fps = float(raw_fps) if fps_ok else 0.0
                  assertions.append({
                      'id': 'soak-tile-' + tid,
                      'expected': 'fps>=10.0 and stalls==0',
                      'observed': 'frames=%d fps=%s stalls=%d [MEASURED]' % (frames, ('%.2f' % fps) if fps_ok else 'non-finite', stalls),
                      'accepted': bool(fps_ok and fps >= 10.0 and stalls == 0 and e['OUTCOME'] == 'PASS'),
                  })
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W0',
              'owner': 'W0-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W0-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': measured,
              'assertions': assertions,
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          blocked() {
            local gate="$1" reason="$2" fixture="$3"
            shift 3
            [ "${1:-}" = "--" ] && shift
            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          ENTRY="tests/test_contract_mutants.py"
          if [ ! -f "$ENTRY" ]; then
