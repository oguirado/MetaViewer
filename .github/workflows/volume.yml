            exit 2
          fi
          LOG="$EVDIR/volume-mutants.log"
          : > "$LOG"
          rc=0
          iters=0
          iter_fail=0
          for i in $(seq 1 100); do
            iters=$((iters + 1))
            timeout 120 python3 -m unittest tests.test_contract_mutants -v >>"$LOG" 2>&1; r=$?
            echo "iteration $i rc $r" >>"$LOG"
            if [ $r -ne 0 ]; then
              iter_fail=$((iter_fail + 1))
              [ $rc -eq 0 ] && rc=$r
            fi
          done
          echo "mutant repetitions: $iters iters, $iter_fail failed" >>"$LOG"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            timeout 1200 python3 agents/tests/run_mutant_harness.py >>"$LOG" 2>&1; mr=$?
            echo "agents mutant harness rc $mr" >>"$LOG"
            [ $mr -ne 0 ] && [ $rc -eq 0 ] && rc=$mr
            timeout 120 python3 tests/test_t7r2c_reproducibility.py --flake-hunt >>"$LOG" 2>&1; fr=$?
            echo "stress flake hunt rc $fr" >>"$LOG"
            [ $fr -ne 0 ] && [ $rc -eq 0 ] && rc=$fr
          fi
          if [ $rc -eq 0 ]; then oc=PASS; rsn="100 mutant repetitions green"; elif [ "$iter_fail" -gt 0 ]; then oc=FAIL; rsn="$iter_fail of 100 mutant repetitions failed"; elif [ "${mr:-0}" -ne 0 ] && [ "${fr:-0}" -ne 0 ]; then oc=FAIL; rsn="agents mutant harness and flake-hunt failed"; elif [ "${mr:-0}" -ne 0 ]; then oc=FAIL; rsn="agents mutant harness failed (rc $mr)"; elif [ "${fr:-0}" -ne 0 ]; then oc=FAIL; rsn="flake-hunt failed (rc $fr)"; else oc=FAIL; rsn="$iter_fail of 100 mutant repetitions failed"; fi
          finish_gate volume-mutants "$rc" "$oc" "$rsn" "$LOG" tests/test_contract_mutants.py "volume:100-iters" 0 -- python3 -m unittest tests.test_contract_mutants -v
          exit $rc
  volume-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5.6.0
        with:
          python-version: "3.12.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node v4.4.0
        with:
          node-version: "24.14.0"
      - name: Require kit access token
        env:
          KIT_REPO_TOKEN: ${{ secrets.KIT_REPO_TOKEN }}
        run: |
          if [ -z "${KIT_REPO_TOKEN:-}" ]; then
            echo "kit absent: repository secret KIT_REPO_TOKEN is not set; cannot stage the pinned capsule-ui-kit checkout" >&2
            exit 1
          fi
      # The ref must equal ui/kit.lock.json "commit"; tools/sync_kit.mjs
      # verifies the checkout (repo URL and HEAD) and fails closed on drift.
      - name: Check out pinned capsule-ui-kit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          repository: oguirado/capsule-ui-kit
          ref: bf31bc201987206d16dbd88d93102f9d5ce026f9
          token: ${{ secrets.KIT_REPO_TOKEN }}
          path: kit-checkout
          fetch-depth: 1
          persist-credentials: false
      - name: Stage pinned kit checkout
        run: |
          set -euo pipefail
          test -d kit-checkout
          KIT_REPO="$(python3 -c 'import json; print(json.load(open("ui/kit.lock.json"))["repo"])')"
          KIT_ORIGIN="$(git -C kit-checkout remote get-url origin)"
          # Canonicalize only the checkout's own URL, never a value from the lock.
          KIT_CANONICAL="${KIT_ORIGIN%.git}.git"
          if [ "$KIT_REPO" != "$KIT_CANONICAL" ]; then
            echo "Kit repository mismatch: checkout origin differs from lock" >&2
            exit 1
          fi
          git -C kit-checkout remote set-url origin "$KIT_CANONICAL"
          echo "MV_KIT_CHECKOUT=${GITHUB_WORKSPACE}/kit-checkout" >> "$GITHUB_ENV"
      # [TARGET, unit decision] These tests compile Rust drivers and validate
      # frozen offline resolution; provision their toolchain/cache explicitly.
      - name: Prime locked npm cache
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require build network namespace
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/workflows/offline.sh true
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # setup-go v5
        with:
          go-version-file: daemon-adapter/go.mod
      - name: Prepare Rust for offline checks
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          cargo fetch --locked
      - name: Install E2E dependencies
        working-directory: ui
        run: bash "$GITHUB_WORKSPACE/.github/workflows/offline.sh" npm ci --offline --no-audit --no-fund
      # [TARGET, unit decision] Ubuntu's AppArmor restriction blocks the
      # downloaded Electron binary's user namespace sandbox. Its bundled
      # chrome-sandbox is not a root-owned setuid installation. Permit user
      # namespaces on this ephemeral CI runner; Chromium stays sandboxed.
      - name: Permit Chromium user namespace sandbox on hosted Ubuntu
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          unshare --user --map-root-user true
      # Electron 44 uses an explicit installer (no npm postinstall hook).
      # Its locked package supplies checksums.json to @electron/get.
      - name: Install and verify pinned Electron binary
        run: node .github/workflows/install_electron.cjs
      - name: Verify clean offline npm ci and Electron dist binding
        env:
          MV_REQUIRE_CLEAN_CI_REPRO: "1"
        run: python3 -m unittest tests/ci/test_fx2_package.py -v
      - name: Run E2E repeat x20 then qualification x300
        env:
          JOB_ID: volume-e2e
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -u -o pipefail
          EVDIR="${RUNNER_TEMP}/metaviewer-ci/${JOB_ID}/${PLATFORM}"
          mkdir -p "${EVDIR}"
          WF_SHA="$(python3 -c 'import hashlib; print(hashlib.sha256(open(".github/workflows/volume.yml","rb").read()).hexdigest())')"
          ISSUER="Volume/${JOB_ID}/${GITHUB_RUN_ID} [VM]"
          sanitize() {
            python3 - "$1" "$2" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          for prefix in ('gh' + 'p_', 'gh' + 's_', 'gh' + 'o_', 'gh' + 'u_', 'gh' + 'r_', 'github_' + 'pat_', 'AK' + 'IA', 'xox' + 'b-', 'MV0-SYNTHETIC-SENTINEL-'):
              p_pat = r'(?:\\?\r?\n)?'.join(r'(?:%s|%%(?:25)*(?:%02x|%02x))' % (re.escape(c), ord(c.lower()), ord(c.upper())) for c in prefix)
              text = re.sub(p_pat + r'(?:[A-Za-z0-9_\-]|%(?:25)*[0-9a-fA-F]{2}|\\\r?\n){4,}', '[REDACTED]', text, flags=re.I)
          text = text.replace('__MV0_PRIVATE_SOURCE_SENTINEL__', '[REDACTED]')
          open(sys.argv[2], 'w').write(text)
          PYEOF
          }
          finish_gate() {
            local gate="$1" rc="$2" outcome="$3" reason="$4" raw="$5" fixture="$6" countsrc="$7" parseut="$8"
            shift 8
            [ "${1:-}" = "--" ] && shift
            local sane="${raw}.sane"
            sanitize "$raw" "$sane" || return 2
            GATE="$gate" PLATFORM="$PLATFORM" ISSUER="$ISSUER" WF_SHA="$WF_SHA" RC="$rc" OUTCOME="$outcome" \
            REASON="$reason" EVDIR="$EVDIR" RAW="$raw" SANE="$sane" FIXTURE="$fixture" COUNTSRC="$countsrc" \
            PARSEUT="$parseut" CWD="$(pwd -P)" GCWD="${GCWD:-}" SHA="$GITHUB_SHA" \
            ARGV_JSON="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$@")" \
            python3 <<'PYEOF' || return 2
          import hashlib, json, os, re
          e = os.environ
          def sha_file(p):
              with open(p, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          rc = None if e['RC'] == 'UNEXEC' else int(e['RC'])
          passed = failed = skipped = None
          if e['PARSEUT'] == '1':
              text = open(e['SANE']).read()
              m = re.search(r'^Ran (\d+) tests?', text, re.M)
              if m:
                  total = int(m.group(1))
                  f = re.search(r'^FAILED \((.*)\)', text, re.M)
                  if f:
                      g = lambda n: (lambda m: int(m.group(1)) if m else 0)(re.search(n + r'=(\d+)', f.group(1)))
                      failed = g('failures') + g('errors')
                      skipped = g('skipped')
                      passed = total - failed - skipped
                  elif re.search(r'^OK', text, re.M):
                      s = re.search(r'^OK \(skipped=(\d+)\)', text, re.M)
                      skipped = int(s.group(1)) if s else 0
                      failed = 0
                      passed = total - skipped
          measured_path = os.path.join(e['EVDIR'], e['GATE'] + '.measured.json')
          measured = json.load(open(measured_path)) if os.path.exists(measured_path) else None
          assertions = [{'id': 'exit-status', 'expected': 'rc 0',
                         'observed': 'unexecuted' if rc is None else 'rc %d' % rc,
                         'accepted': e['OUTCOME'] == 'PASS'}]
          if isinstance(measured, dict) and isinstance(measured.get('tiles'), list):
              import math
              for tile in measured['tiles']:
                  tid = str(tile.get('id', 'tile'))
                  raw_frames = tile.get('frames', 0)
                  raw_stalls = tile.get('stalls', 0)
                  raw_fps = tile.get('fps', 0.0)
                  frames = raw_frames if type(raw_frames) is int and raw_frames >= 0 else 0
                  stalls = raw_stalls if type(raw_stalls) is int and raw_stalls >= 0 else 1
                  fps_ok = not isinstance(raw_fps, bool) and isinstance(raw_fps, (int, float)) and math.isfinite(float(raw_fps))
                  fps = float(raw_fps) if fps_ok else 0.0
                  assertions.append({
                      'id': 'soak-tile-' + tid,
                      'expected': 'fps>=10.0 and stalls==0',
                      'observed': 'frames=%d fps=%s stalls=%d [MEASURED]' % (frames, ('%.2f' % fps) if fps_ok else 'non-finite', stalls),
                      'accepted': bool(fps_ok and fps >= 10.0 and stalls == 0 and e['OUTCOME'] == 'PASS'),
                  })
          receipt = {
              'schema': 'gate_receipt/v1', 'gate_id': e['GATE'], 'leg': e['GATE'], 'profile': 'W0',
              'owner': 'W0-CI-MATRIX', 'issuer': e['ISSUER'],
              'scope': {'unit': 'W0-CI-MATRIX', 'platform': e['PLATFORM'], 'feature': e['GATE'],
                        'artifact': e['GATE'] + '.receipt.json'},
              'argv': json.loads(e['ARGV_JSON']), 'cwd': e['GCWD'] or e['CWD'],
              'rc': rc, 'outcome': e['OUTCOME'], 'reason': e['REASON'],
              'identities': {'gate_revision': e['SHA'], 'instrument_sha256': sha_file(e['FIXTURE']),
                             'sanitized_log_sha256': sha_file(e['SANE']), 'configuration_sha256': e['WF_SHA'],
                             'log_sha256': sha_file(e['RAW']), 'fixture_sha256': [sha_file(e['FIXTURE'])]},
              'product_identity': measured,
              'assertions': assertions,
              'counts': {'passed': passed, 'failed': failed, 'skipped': skipped, 'source': e['COUNTSRC']}}
          out = os.path.join(e['EVDIR'], e['GATE'] + '.receipt.json')
          with open(out, 'w') as f:
              json.dump(receipt, f, indent=2)
          print('receipt: ' + out)
          PYEOF
            {
              echo "## ${gate} [VM] rc ${rc/UNEXEC/UNKNOWN}"
              echo "outcome ${outcome}: ${reason}"
              echo '```'
              tail -n 40 "$sane"
              echo '```'
              echo '```'
              grep -E '^FAIL' "$sane" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          blocked() {
            local gate="$1" reason="$2" fixture="$3"
            shift 3
            [ "${1:-}" = "--" ] && shift
            local raw="$EVDIR/${gate}.log"
            printf 'BLOCKED: %s\n' "$reason" > "$raw"
            finish_gate "$gate" UNEXEC BLOCKED "$reason" "$raw" "$fixture" "unexecuted" 0 -- "$@"
            return 2
          }
          HARNESS="tests/e2e/run.py"
          if [ ! -f "$HARNESS" ]; then
            blocked volume-e2e "E2E harness $HARNESS ABSENT" .github/workflows/volume.yml -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py
            exit 2
          fi
          if ! command -v xvfb-run >/dev/null 2>&1; then
            blocked volume-e2e "xvfb-run not installed on runner" tests/e2e/run.py -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py
            exit 2
          fi
          JOB_TIMEOUT_SECS="${MV_VOLUME_JOB_TIMEOUT_SECS:-10800}"
          ATTEMPT_TIMEOUT_SECS="${MV_VOLUME_ATTEMPT_TIMEOUT_SECS:-1200}"
          PER_ATTEMPT_BUDGET_SECS="${MV_VOLUME_PER_ATTEMPT_BUDGET_SECS:-30}"
          SHARD_COUNT="${MV_VOLUME_SHARD_COUNT:-1}"
          SMOKE_REPS="${MV_VOLUME_SMOKE_REPS:-20}"
          QUAL_REPS="${MV_VOLUME_QUAL_REPS:-300}"
          SOAK_BUDGET_SECS="${MV_SOAK_SECS:-600}"
          if ! python3 - "$JOB_TIMEOUT_SECS" "$ATTEMPT_TIMEOUT_SECS" "$PER_ATTEMPT_BUDGET_SECS" "$SHARD_COUNT" "$SMOKE_REPS" "$QUAL_REPS" "$SOAK_BUDGET_SECS" <<'PYEOF'
          import math, sys
          job_timeout, attempt_timeout, attempt_cost, shards, smoke_reps, qual_reps, soak_secs = [int(x) for x in sys.argv[1:8]]
          if shards < 1 or smoke_reps < 1 or qual_reps < 1 or attempt_timeout < 600 or attempt_cost < 1:
              sys.exit(1)
          reps_per_shard = math.ceil((smoke_reps + qual_reps) / shards)
          required_secs = reps_per_shard * attempt_cost + soak_secs + 60
          if attempt_timeout > job_timeout or required_secs > job_timeout:
              sys.exit(1)
          PYEOF
          then
            blocked volume-e2e "volume-e2e budget exceeds job timeout" .github/workflows/volume.yml -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py
            exit 2
          fi
          LOG="$EVDIR/volume-e2e.log"
          : > "$LOG"
          rc=0
          iters=0
          iter_fail=0
          for i in $(seq 1 "$SMOKE_REPS"); do
            iters=$((iters + 1))
            timeout "$ATTEMPT_TIMEOUT_SECS" xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py >>"$LOG" 2>&1; r=$?
            echo "iteration $i rc $r" >>"$LOG"
            if [ $r -ne 0 ]; then
              iter_fail=$((iter_fail + 1))
              [ $rc -eq 0 ] && rc=$r
            fi
          done
          echo "e2e repetitions: $iters iters, $iter_fail failed" >>"$LOG"
          if [ $rc -eq 0 ]; then oc=PASS; rsn="20 e2e repetitions green"; else oc=FAIL; rsn="$iter_fail of 20 e2e repetitions failed"; fi
          finish_gate volume-e2e "$rc" "$oc" "$rsn" "$LOG" tests/e2e/run.py "volume:20-iters" 0 -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py
          [ "$rc" -eq 0 ] || exit "$rc"
          LOG="$EVDIR/volume-e2e-qualification.log"
          : > "$LOG"
          rc=0
          iters=0
          iter_fail=0
          for i in $(seq 1 "$QUAL_REPS"); do
            iters=$((iters + 1))
            timeout "$ATTEMPT_TIMEOUT_SECS" xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py >>"$LOG" 2>&1; r=$?
            echo "iteration $i rc $r" >>"$LOG"
            if [ $r -ne 0 ]; then
              iter_fail=$((iter_fail + 1))
              [ $rc -eq 0 ] && rc=$r
            fi
          done
          echo "e2e repetitions: $iters iters, $iter_fail failed" >>"$LOG"
          if [ $rc -eq 0 ]; then oc=PASS; rsn="300 e2e repetitions green"; else oc=FAIL; rsn="$iter_fail of 300 e2e repetitions failed"; fi
          finish_gate volume-e2e-qualification "$rc" "$oc" "$rsn" "$LOG" tests/e2e/run.py "volume:300-iters" 0 -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/e2e/run.py
          [ "$rc" -eq 0 ] || exit "$rc"
          LOG="$EVDIR/volume-wall-soak.log"
          : > "$LOG"
          rc=0
          SOAK_SECS="${MV_SOAK_SECS:-600}"
          SOAK_BUILD="$EVDIR/soak-build"
          SOAK_REPORT="$EVDIR/volume-wall-soak-report.json"
          ELECTRON_BIN="electron"
          if [ -n "${MV_SOAK_REPORT_FIXTURE:-}" ]; then
            cp "$MV_SOAK_REPORT_FIXTURE" "$SOAK_REPORT" >>"$LOG" 2>&1 || rc=1
          else
            (
              set -e
              node tools/sync_kit.mjs "${MV_KIT_CHECKOUT:-${CAPSULE_UI_KIT_REPO:-}}"
              MV_E2E_BUILD="$SOAK_BUILD" timeout 120 node tests/e2e/perf-build.mjs
              ELECTRON_BIN="$(node -e 'console.log(require("./tests/e2e/ac-harness.cjs").electronBinary(process.cwd()))')"
              timeout 660 xvfb-run -a -s "-screen 0 1280x900x24" "$ELECTRON_BIN" tests/e2e/perf-main.cjs "$SOAK_BUILD" "$SOAK_REPORT" "{\"seconds\":${SOAK_SECS}}"
            ) >>"$LOG" 2>&1 || rc=1
            ELECTRON_BIN="$(node -e 'console.log(require("./tests/e2e/ac-harness.cjs").electronBinary(process.cwd()))' 2>/dev/null || echo electron)"
          fi
          SOAK_REPORT="$SOAK_REPORT" SOAK_SECS="$SOAK_SECS" MEASURED_OUT="$EVDIR/volume-wall-soak.measured.json" \
          python3 - <<'PYEOF' >>"$LOG" 2>&1 || rc=1
          import json, math, os, sys
          def is_finite_num(v):
              return not isinstance(v, bool) and isinstance(v, (int, float)) and math.isfinite(float(v))
          report_path = os.environ["SOAK_REPORT"]
          soak_secs = int(os.environ["SOAK_SECS"])
          if soak_secs < 3 or soak_secs > 600:
              print("FAIL volume-wall-soak: invalid MV_SOAK_SECS=%d" % soak_secs)
              sys.exit(1)
          if not os.path.isfile(report_path):
              print("FAIL volume-wall-soak: soak report missing")
              sys.exit(1)
          report = json.load(open(report_path, "r", encoding="utf-8"))
          if report.get("schema") != "metaviewer.perf-wall/v1" or report.get("capture") != "synthetic-rgb24":
              print("FAIL volume-wall-soak: invalid report schema")
              sys.exit(1)
          visible = report.get("visible")
          if (not isinstance(visible, list) or len(visible) < 4
                  or any(not isinstance(t, dict) or not isinstance(t.get("id"), str) or not t.get("id").strip() for t in visible)
                  or len({t.get("id") for t in visible}) != len(visible)):
              print("FAIL volume-wall-soak: expected >= 4 distinct visible tiles")
              sys.exit(1)
          raw_started = report.get("started")
          raw_ended = report.get("ended")
          failures = []
          if not is_finite_num(raw_started) or not is_finite_num(raw_ended):
              started = 0.0
              ended = 0.0
              duration_ms = 0.0
              failures.append("non_finite_window")
          else:
              started = float(raw_started)
              ended = float(raw_ended)
              duration_ms = ended - started
              if not math.isfinite(duration_ms):
                  duration_ms = 0.0
                  failures.append("non_finite_duration")
          min_duration_ms = max(2900.0, soak_secs * 1000.0 - 100.0)
          if duration_ms < min_duration_ms:
              failures.append("duration_ms=%.1f<%.1f" % (duration_ms, min_duration_ms))
          tiles_summary = []
          stalled_tiles = []
          total_stalls = 0
          for tile in visible:
              tid = str(tile.get("id", ""))
              raw_times = tile.get("times")
              times_valid = isinstance(raw_times, list) and len(raw_times) > 0 and all(is_finite_num(t) for t in raw_times)
              times = [float(t) for t in raw_times] if times_valid else []
              frames = len(times) if times_valid else 0
              raw_fps = (frames * 1000.0 / duration_ms) if (times_valid and duration_ms > 0) else 0.0
              fps = raw_fps if math.isfinite(raw_fps) else 0.0
              if times_valid and is_finite_num(raw_started) and is_finite_num(raw_ended):
                  seq = [started, *times, ended]
                  gaps = [seq[i] - seq[i - 1] for i in range(1, len(seq))]
                  gaps_valid = all(math.isfinite(g) for g in gaps)
              else:
                  gaps = []
                  gaps_valid = False
              stalls = sum(1 for g in gaps if not math.isfinite(g) or g < 0 or g > 2000.0) if gaps_valid else 1
              max_gap_ms = max((g for g in gaps if math.isfinite(g)), default=0.0) if gaps_valid else 0.0
              info = tile.get("info") if isinstance(tile.get("info"), dict) else {}
              present_count = info.get("presentCount")
              raw_last_gen = info.get("lastCaptureGeneration", 0)
              last_gen = raw_last_gen if type(raw_last_gen) is int else 0
              pix = tile.get("pixel")
              exp_pix = tile.get("expectedPixel")
              pixel_ok = (
                  pix is not None
                  and exp_pix is not None
                  and isinstance(pix, list)
                  and isinstance(exp_pix, list)
                  and len(pix) >= 3
                  and pix == exp_pix
              )
              tile_stalled = (
                  not times_valid
                  or not gaps_valid
                  or stalls > 0
                  or not math.isfinite(fps)
                  or fps < 10.0
                  or type(present_count) is not int
                  or present_count != frames
                  or last_gen <= 0
                  or not pixel_ok
              )
              if tile_stalled:
                  stalled_tiles.append(tid)
                  if stalls == 0:
                      stalls = 1
                  failures.append("tile:%s(frames=%d,fps=%.2f,stalls=%d,max_gap_ms=%.1f)" % (tid, frames, fps, stalls, max_gap_ms))
              total_stalls += stalls
              tiles_summary.append({
                  "id": tid,
                  "frames": frames,
                  "fps": round(fps, 3),
                  "stalls": stalls,
                  "max_gap_ms": round(max_gap_ms, 3),
              })
          folded = report.get("folded") if isinstance(report.get("folded"), dict) else {}
          f_before = folded.get("before") if isinstance(folded.get("before"), dict) else {}
          f_after = folded.get("after") if isinstance(folded.get("after"), dict) else {}
          b_gen = f_before.get("lastCaptureGeneration")
          a_gen = f_after.get("lastCaptureGeneration")
          b_draws = f_before.get("drawSubmissions")
          a_draws = f_after.get("drawSubmissions")
          folded_ok = (
              folded.get("hidden") is True
              and f_after.get("folded") is True
              and f_after.get("captureLeaseActive") is True
              and type(b_gen) is int and type(a_gen) is int and a_gen > b_gen
              and type(b_draws) is int and type(a_draws) is int and a_draws == b_draws
          )
          if not folded_ok:
              failures.append("folded_capture_stall")
          evidence_mode = "synthetic" if report.get("capture") == "synthetic-rgb24" else "live"
          measured = {
              "schema": "metaviewer.perf-wall.soak-summary/v1",
              "soak_seconds": soak_secs,
              "evidence_mode": evidence_mode,
              "capture": report.get("capture"),
              "producer": "tests/e2e/perf-main.cjs",
              "duration_ms": round(duration_ms, 3),
              "frames_per_tile": {t["id"]: t["frames"] for t in tiles_summary},
              "stalls_per_tile": {t["id"]: t["stalls"] for t in tiles_summary},
              "tiles": tiles_summary,
              "total_stalls": total_stalls,
              "stalled_tiles": stalled_tiles,
              "folded_capture_advanced": folded_ok,
              "failures": failures,
          }
          with open(os.environ["MEASURED_OUT"], "w", encoding="utf-8") as mf:
              json.dump(measured, mf, indent=2)
          print("SOAK_WALL [MEASURED]: " + json.dumps(measured))
          if failures:
              print("FAIL volume-wall-soak: " + ", ".join(failures))
              sys.exit(1)
          print("PASS volume-wall-soak: %d tiles, 0 stalls" % len(tiles_summary))
          PYEOF
          if [ "$SOAK_SECS" -eq 600 ] && [ "${MV_SOAK_EVIDENCE_MODE:-synthetic}" = "live" ]; then
            soak_desc="10-minute live wall soak"
          else
            soak_desc="${SOAK_SECS}s ${MV_SOAK_EVIDENCE_MODE:-synthetic} wall soak"
          fi
          if [ $rc -eq 0 ]; then oc=PASS; rsn="${soak_desc} green"; else oc=FAIL; rsn="${soak_desc} failed"; fi
          finish_gate volume-wall-soak "$rc" "$oc" "$rsn" "$LOG" tests/e2e/e2e14_perf.test.js "volume:soak-${SOAK_SECS}s" 0 -- timeout 660 xvfb-run -a -s "-screen 0 1280x900x24" "${ELECTRON_BIN:-electron}" tests/e2e/perf-main.cjs "$SOAK_BUILD" "$SOAK_REPORT" "{\"seconds\":${SOAK_SECS}}"
          exit $rc
