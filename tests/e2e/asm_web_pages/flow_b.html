<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ASM Web Acceptance — Flow Step 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 640px;
    height: 360px;
    overflow: hidden;
    background: #0f172a;
    color: #e2e8f0;
    font: 14px/20px monospace;
  }
  #stage {
    position: relative;
    width: 640px;
    height: 360px;
    padding: 24px;
  }
  #flow-heading {
    position: absolute;
    left: 24px;
    top: 24px;
    width: 592px;
    height: 28px;
    font-weight: 700;
  }
  #flow-confirmation {
    position: absolute;
    left: 24px;
    top: 68px;
    width: 480px;
    height: 36px;
    padding: 6px 10px;
    background: #064e3b;
    color: #ecfdf5;
    border: 2px solid #34d399;
  }
  #back-btn {
    position: absolute;
    left: 24px;
    top: 132px;
    width: 240px;
    height: 44px;
    display: inline-block;
    padding: 10px 16px;
    background: #334155;
    color: #f8fafc;
    border: 2px solid #94a3b8;
    text-decoration: none;
    font: 700 14px/20px monospace;
    cursor: pointer;
  }
</style>
</head>
<body>
<main id="stage" data-page-id="flow_b" data-flow-step="2" data-viewport="640x360">
  <h1 id="flow-heading">Two-Page Navigation — Step 2 of 2</h1>
  <p role="status" id="flow-confirmation" data-role="status" data-bbox="24,68,480,36">FLOW_STEP_2_CONFIRMED</p>
  <a
    id="back-btn"
    href="flow_a.html"
    tabindex="1"
    role="button"
    aria-label="Return to Step 1"
    data-role="button"
    data-target-page="flow_a.html"
    data-bbox="24,132,240,44"
  >Return to Step 1</a>
</main>
<script>
  (function () {
    var marker = document.getElementById('flow-confirmation');
    marker.setAttribute('aria-label', marker.textContent);
    var back = document.getElementById('back-btn');
    back.setAttribute('data-nav-ready', 'true');
  })();
</script>
</body>
</html>
