[package]
name = "guest-command-broker"
version = "0.2.5"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
panic = "abort"

[features]
rewind-profile = []

[[bin]]
name = "rewind-command-broker"
path = "src/bin/rewind-command-broker.rs"
required-features = ["rewind-profile"]
